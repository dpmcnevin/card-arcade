name: Deploy to GitHub Pages

# Tests the kit, builds the arcade and publishes it with GitHub Pages. With
# the account's custom domain it's served at https://corrupt.net/card-arcade/,
# with a page per game: /hearts/, /bridge/, /euchre/.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
      # The base path follows the repository name, so a rename just works.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
      - name: Add .nojekyll to bypass GitHub Pages Jekyll processing
        run: touch arcade/build/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: arcade/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      # Pages occasionally reports a transient failure; retry once.
      - id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy2
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4
